services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    # Streamlit always calls the API by *service name* + *container* port (8000).
    # API_HOST_PORT only changes the port on your Mac; it must NOT be copied into API_URL here.
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    # Host port (left side): set STREAMLIT_HOST_PORT in .env if 8501 is already in use.
    ports:
      - "${STREAMLIT_HOST_PORT:-8501}:8501"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./src/chatbot_ui:/app/src/chatbot_ui

  api:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    # Left side = port on your machine; right side = port inside the container (always 8000).
    # Other services still use http://api:8000 — do not set API_URL to localhost for Docker.
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./src/api:/app/src/api

  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - 5434:5432
    environment:
      POSTGRES_DB: langgraph_db
      POSTGRES_USER: langgraph_user
      POSTGRES_PASSWORD: langgraph_password
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

